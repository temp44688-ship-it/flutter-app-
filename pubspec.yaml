name: flutter_app
description: Example Flutter feature with clean architecture and real HTTP data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  injectable: ^2.5.0
  dartz: ^0.10.1
  dio: ^5.7.0
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true
